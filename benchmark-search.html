<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Performance Benchmark</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #cccccc;
        }
        h1, h2 {
            color: #ffffff;
        }
        .result {
            background: #252526;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
        }
        .winner {
            background: #1e3a1e;
            border-color: #4caf50;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }
        .value {
            color: #00ff00;
            font-weight: bold;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0099ff;
        }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🚀 Search Performance Benchmark</h1>

    <button onclick="runBenchmark(10)">10개 LOT 비교</button>
    <button onclick="runBenchmark(100)">100개 LOT 비교</button>
    <button onclick="runBenchmark(1000)">1000개 LOT 비교</button>

    <div id="results"></div>

    <script type="module">
        // extractLotTokensFromPath 함수 (실제 코드에서 가져옴)
        function extractLotTokensFromPath(path) {
            if (!path) return null;

            const fileName = path.split('/').pop().split('\\').pop();
            const baseName = fileName.replace(/\.[^/.]+$/, '');
            const parts = baseName.split('_');

            if (parts.length < 2) return null;

            return {
                lotValue: parts[0] || '',
                waferValue: parts[1] || '',
                root: parts[0] || ''
            };
        }

        // 현재 OR 검색 방식
        function currentOrSearchMethod(fileNames, lotQuery) {
            const query = lotQuery.toLowerCase();
            const orTerms = query.split(' or ').map(t => t.trim());

            const results = [];
            for (const fileName of fileNames) {
                const normalizedName = fileName.toLowerCase();
                if (orTerms.some(term => normalizedName.includes(term))) {
                    results.push(fileName);
                }
            }
            return results;
        }

        // 제안된 슬래시 + split 방식
        function proposedSlashSplitMethod(fileNames, lotQuery) {
            const lotSet = new Set(lotQuery.split('/'));

            const results = [];
            for (const fileName of fileNames) {
                const tokens = extractLotTokensFromPath(fileName);
                if (tokens && lotSet.has(tokens.lotValue)) {
                    results.push(fileName);
                }
            }
            return results;
        }

        // 테스트 데이터 생성
        function generateTestData(numLots, filesPerLot = 20) {
            const fileNames = [];
            const lots = [];

            // LOT 생성
            for (let i = 0; i < numLots; i++) {
                const lotName = `LOT${String(i).padStart(4, '0')}`;
                lots.push(lotName);

                // 각 LOT마다 여러 Wafer 파일 생성
                for (let w = 1; w <= filesPerLot; w++) {
                    fileNames.push(`${lotName}_Wafer${w}_Site1.jpg`);
                }
            }

            // 추가 노이즈 파일 (매치되지 않는 파일들)
            for (let i = 0; i < 1000; i++) {
                fileNames.push(`NOISE${i}_Wafer1_Site1.jpg`);
            }

            return { fileNames, lots };
        }

        // 벤치마크 실행
        window.runBenchmark = function(numLots) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>🔄 Running benchmark...</h2>';

            // 약간의 지연 후 실행 (UI 업데이트를 위해)
            setTimeout(() => {
                const { fileNames, lots } = generateTestData(numLots);

                // OR 검색 쿼리 생성
                const orQuery = lots.join(' OR ');

                // 슬래시 검색 쿼리 생성
                const slashQuery = lots.join('/');

                const iterations = 100; // 100회 반복 측정

                // 현재 방식 벤치마크
                const startCurrent = performance.now();
                let currentResults;
                for (let i = 0; i < iterations; i++) {
                    currentResults = currentOrSearchMethod(fileNames, orQuery);
                }
                const endCurrent = performance.now();
                const currentTime = endCurrent - startCurrent;

                // 제안 방식 벤치마크
                const startProposed = performance.now();
                let proposedResults;
                for (let i = 0; i < iterations; i++) {
                    proposedResults = proposedSlashSplitMethod(fileNames, slashQuery);
                }
                const endProposed = performance.now();
                const proposedTime = endProposed - startProposed;

                // 결과 계산
                const avgCurrentTime = currentTime / iterations;
                const avgProposedTime = proposedTime / iterations;
                const speedup = currentTime / proposedTime;
                const winner = proposedTime < currentTime ? 'proposed' : 'current';

                // 결과 표시
                resultsDiv.innerHTML = `
                    <h2>📊 Benchmark Results (${numLots} LOTs)</h2>

                    <div class="result">
                        <h3>📁 Test Data</h3>
                        <div class="metric">
                            <span>LOT 개수:</span>
                            <span class="value">${numLots}개</span>
                        </div>
                        <div class="metric">
                            <span>총 파일 수:</span>
                            <span class="value">${fileNames.length.toLocaleString()}개</span>
                        </div>
                        <div class="metric">
                            <span>반복 횟수:</span>
                            <span class="value">${iterations}회</span>
                        </div>
                    </div>

                    <div class="result ${winner === 'current' ? 'winner' : ''}">
                        <h3>⚡ 현재 방식 (OR 검색)</h3>
                        <div class="metric">
                            <span>총 실행 시간:</span>
                            <span class="value">${currentTime.toFixed(2)} ms</span>
                        </div>
                        <div class="metric">
                            <span>평균 실행 시간:</span>
                            <span class="value">${avgCurrentTime.toFixed(3)} ms</span>
                        </div>
                        <div class="metric">
                            <span>매치된 파일:</span>
                            <span class="value">${currentResults.length}개</span>
                        </div>
                        <pre>쿼리: ${orQuery.length > 100 ? orQuery.substring(0, 100) + '...' : orQuery}</pre>
                    </div>

                    <div class="result ${winner === 'proposed' ? 'winner' : ''}">
                        <h3>🚀 제안 방식 (슬래시 + Split)</h3>
                        <div class="metric">
                            <span>총 실행 시간:</span>
                            <span class="value">${proposedTime.toFixed(2)} ms</span>
                        </div>
                        <div class="metric">
                            <span>평균 실행 시간:</span>
                            <span class="value">${avgProposedTime.toFixed(3)} ms</span>
                        </div>
                        <div class="metric">
                            <span>매치된 파일:</span>
                            <span class="value">${proposedResults.length}개</span>
                        </div>
                        <pre>쿼리: ${slashQuery.length > 100 ? slashQuery.substring(0, 100) + '...' : slashQuery}</pre>
                    </div>

                    <div class="result" style="background: #2a2a3e; border-color: #5555ff;">
                        <h3>🏆 Winner: ${winner === 'proposed' ? '제안 방식' : '현재 방식'}</h3>
                        <div class="metric">
                            <span>성능 차이:</span>
                            <span class="value">${speedup > 1 ?
                                `제안 방식이 ${speedup.toFixed(2)}배 빠름` :
                                `현재 방식이 ${(1/speedup).toFixed(2)}배 빠름`}</span>
                        </div>
                        <div class="metric">
                            <span>시간 절약:</span>
                            <span class="value">${Math.abs(currentTime - proposedTime).toFixed(2)} ms (${iterations}회 기준)</span>
                        </div>
                    </div>
                `;
            }, 100);
        };

        // 페이지 로드 시 자동으로 10개 테스트 실행
        window.addEventListener('load', () => {
            runBenchmark(10);
        });
    </script>
</body>
</html>
