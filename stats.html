<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웨이퍼맵 뷰어 접속 분석</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #4CAF50, #81C784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            width: 200px;
            height: 100%;
            justify-content: flex-start;
        }
        
        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
        }
        
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .btn.secondary {
            background: #2196F3;
        }
        
        .btn.secondary:hover {
            background: #1976D2;
        }
        
        .stats-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #4CAF50;
            border-left: 4px solid #4CAF50;
            padding-left: 12px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }
        
        .stat-label {
            font-size: 1rem;
            color: #aaa;
            font-weight: 500;
        }
        
        .chart-container {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #333;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
            background: #0f0f23;
            border-radius: 8px;
            padding: 20px;
        }
        
        .user-table {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .table-header {
            background: linear-gradient(135deg, #2a2a2a, #333);
            padding: 20px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .table-content {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .user-row {
            display: grid;
            grid-template-columns: 130px 120px 1fr 80px 80px 120px 120px;
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .user-row:hover {
            background: #2a2a3e;
        }
        
        .user-row.clickable:hover {
            background: #1e3c72;
        }
        
        .user-id {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .ip-address {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #2196F3;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: #1a1a2e;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #4CAF50;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        
        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .close:hover {
            color: #f44336;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 1.2rem;
        }
        
        .error {
            color: #f44336;
            text-align: center;
            padding: 40px;
            background: #2a1a1a;
            border-radius: 8px;
            border: 1px solid #f44336;
        }
        
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .detail-card {
            background: #2a2a3e;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        
        .detail-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .activity-list {
            background: #2a2a3e;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .activity-item {
            padding: 8px 0;
            border-bottom: 1px solid #444;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .main-layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .users-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .department-charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 웨이퍼맵 뷰어 접속 분석</h1>
            <p>실시간 사용자 접속 현황 및 시각적 트렌드 분석</p>
        </div>
        
        <!-- 메인 레이아웃: 왼쪽 컨트롤 + 오른쪽 오늘 요약 -->
        <div class="main-layout">
            <div class="controls">
                <button class="btn" onclick="loadStats()">🔄 새로고침</button>
                <button class="btn secondary" onclick="exportStats()">📥 통계 내보내기</button>
            </div>
            
            <div class="stats-section">
                <h2 class="section-title">📋 오늘 요약</h2>
                <div class="stats-grid" id="dailyStats" style="grid-template-columns: repeat(4, 1fr);">
                    <div class="loading">통계 로딩 중...</div>
                </div>
            </div>
        </div>
        
        <!-- 사용자 섹션: 사용자 목록 + 최근 사용자 -->
        <div class="users-section">
            <div class="stats-section">
                <h2 class="section-title">👥 사용자 목록 (활동량 순)</h2>
                <div class="user-table">
                    <div class="table-header" style="flex-shrink: 0; padding: 8px 12px; background: #333; font-size: 0.9em; border-radius: 4px; margin-bottom: 8px;">
                        총 사용자: <span id="totalUsers" style="color: #4CAF50; font-weight: bold;">-</span>명
                    </div>
                    <div class="table-content" id="userTable">
                        <div class="loading">사용자 데이터 로딩 중...</div>
                    </div>
                </div>
            </div>
            
            <div class="stats-section">
                <h2 class="section-title">🕐 최근 사용자</h2>
                <div class="user-table">
                    <div class="table-header" style="flex-shrink: 0; padding: 8px 12px; background: #333; font-size: 0.9em; border-radius: 4px; margin-bottom: 8px;">
                        최근 활동: <span id="recentUsersCount" style="color: #FF9800; font-weight: bold;">-</span>명
                    </div>
                    <div class="table-content" id="recentUserTable">
                        <div class="loading">최근 사용자 로딩 중...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 차트 섹션: 일별 + 월별 트렌드 -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
            <div class="stats-section">
                <h2 class="section-title">📈 일별 접속 트렌드 (최근 14일)</h2>
                <div class="chart-container" style="margin-bottom: 0;">
                    <div class="chart-wrapper" style="height: 300px;">
                        <canvas id="dailyChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="stats-section">
                <h2 class="section-title">📅 월별 접속 트렌드 (최근 6개월)</h2>
                <div class="chart-container" style="margin-bottom: 0;">
                    <div class="chart-wrapper" style="height: 300px;">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 부서 분석 섹션 -->
        <div class="department-charts">
            <div class="stats-section">
                <h2 class="section-title">🏢 부서별 사용자 분포</h2>
                <div class="user-table" style="margin-bottom: 0;">
                    <div class="table-content" id="departmentTable" style="max-height: 400px;">
                        <div class="loading">부서 데이터 로딩 중...</div>
                    </div>
                </div>
            </div>
            
            <div class="stats-section">
                <h2 class="section-title">📊 부서별 접속 활동량 (Top 10)</h2>
                <div class="chart-container" style="margin-bottom: 0;">
                    <div class="chart-wrapper" style="height: 300px;">
                        <canvas id="departmentActivityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 사용자 상세 정보 모달 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">사용자 상세 정보</h2>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalBody">
                <div class="loading">로딩 중...</div>
            </div>
        </div>
    </div>

    <script>
        let dailyChart = null;
        let monthlyChart = null;
        let departmentChart = null;
        let departmentActivityChart = null;
        let trendData = null;
        let monthlyData = null;
        let departmentData = null;
        
        async function loadStats() {
            try {
                // 병렬로 모든 데이터 로드
                const [dailyResponse, trendResponse, monthlyResponse, usersResponse, recentUsersResponse, departmentResponse] = await Promise.all([
                    fetch('/api/stats/daily'),
                    fetch('/api/stats/trend?days=14'),
                    fetch('/api/stats/monthly?months=6'),
                    fetch('/api/stats/users'),
                    fetch('/api/stats/recent-users'),
                    fetch('/api/stats/department')
                ]);
                
                const dailyData = await dailyResponse.json();
                trendData = await trendResponse.json();
                monthlyData = await monthlyResponse.json();
                const usersData = await usersResponse.json();
                const recentUsersData = await recentUsersResponse.json();
                
                // 부서 데이터가 없는 경우 빈 객체로 처리
                try {
                    departmentData = await departmentResponse.json();
                } catch (e) {
                    console.warn('부서 데이터 로드 실패:', e);
                    departmentData = { departments: {}, activity: {} };
                }
                
                renderDailyStats(dailyData);
                renderUserTable(usersData.users);
                renderRecentUserTable(recentUsersData.recent_users);
                
                // 모든 차트 렌더링
                renderDailyChart();
                renderMonthlyChart();
                renderDepartmentTable();
                renderDepartmentActivityChart();
                
                document.getElementById('totalUsers').textContent = usersData.total_users;
                document.getElementById('recentUsersCount').textContent = recentUsersData.total_recent;
                
            } catch (error) {
                console.error('통계 로드 실패:', error);
                showError('통계 로드에 실패했습니다.');
            }
        }
        
        function renderDailyStats(data) {
            const container = document.getElementById('dailyStats');
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${data.total_users}</div>
                    <div class="stat-label">총 사용자 수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.active_today}</div>
                    <div class="stat-label">오늘 활성 사용자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.new_users_today}</div>
                    <div class="stat-label">오늘 신규 사용자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${data.total_requests_today}</div>
                    <div class="stat-label">오늘 총 요청 수</div>
                </div>
            `;
        }
        
        function renderDailyChart() {
            if (!trendData) return;
            
            const ctx = document.getElementById('dailyChart');
            
            // 기존 차트 삭제
            if (dailyChart) {
                dailyChart.destroy();
            }
            
            // 차트 데이터 준비
            const sortedDates = Object.keys(trendData).sort();
            const labels = sortedDates.map(date => formatChartDate(date));
            const activeUsers = sortedDates.map(date => trendData[date].active_users);
            const newUsers = sortedDates.map(date => trendData[date].new_users);
            const totalRequests = sortedDates.map(date => trendData[date].total_requests);
            
            dailyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '활성 사용자',
                            data: activeUsers,
                            borderColor: '#4CAF50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '신규 사용자',
                            data: newUsers,
                            borderColor: '#2196F3',
                            backgroundColor: 'rgba(33, 150, 243, 0.1)',
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '총 요청 수',
                            data: totalRequests,
                            borderColor: '#FF9800',
                            backgroundColor: 'rgba(255, 152, 0, 0.1)',
                            yAxisID: 'y1',
                            tension: 0.4
                        }
                    ]
                },
                options: getChartOptions('일별')
            });
        }
        
        function renderMonthlyChart() {
            if (!monthlyData) return;
            
            const ctx = document.getElementById('monthlyChart');
            
            // 기존 차트 삭제
            if (monthlyChart) {
                monthlyChart.destroy();
            }
            
            // 차트 데이터 준비
            const sortedMonths = Object.keys(monthlyData).sort();
            const labels = sortedMonths.map(month => monthlyData[month].month_name);
            const activeUsers = sortedMonths.map(month => monthlyData[month].active_users);
            const newUsers = sortedMonths.map(month => monthlyData[month].new_users);
            const totalRequests = sortedMonths.map(month => monthlyData[month].total_requests);
            
            monthlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '활성 사용자',
                            data: activeUsers,
                            backgroundColor: 'rgba(76, 175, 80, 0.8)',
                            borderColor: '#4CAF50',
                            borderWidth: 1
                        },
                        {
                            label: '신규 사용자',
                            data: newUsers,
                            backgroundColor: 'rgba(33, 150, 243, 0.8)',
                            borderColor: '#2196F3',
                            borderWidth: 1
                        },
                        {
                            label: '총 요청 수',
                            data: totalRequests,
                            backgroundColor: 'rgba(255, 152, 0, 0.8)',
                            borderColor: '#FF9800',
                            borderWidth: 1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: getChartOptions('월별')
            });
        }
        
        function renderDepartmentTable() {
            const container = document.getElementById('departmentTable');
            
            if (!departmentData || !departmentData.departments || Object.keys(departmentData.departments).length === 0) {
                container.innerHTML = '<div class="loading">부서 데이터가 없습니다.</div>';
                return;
            }
            
            // 부서 데이터를 사용자 수 기준으로 정렬
            const departments = Object.keys(departmentData.departments)
                .map(dept => ({
                    key: dept,
                    name: departmentData.departments[dept].name || dept,
                    userCount: departmentData.departments[dept].user_count || 0,
                    totalRequests: departmentData.departments[dept].total_requests || 0
                }))
                .sort((a, b) => b.userCount - a.userCount);
            
            let html = `
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; padding: 8px 12px; background: #333; font-weight: bold; font-size: 0.9em; border-radius: 4px; margin-bottom: 4px;">
                    <div>부서명</div>
                    <div style="text-align: center;">사용자 수</div>
                    <div style="text-align: center;">총 요청 수</div>
                </div>
            `;
            
            departments.forEach(dept => {
                html += `
                    <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #333; font-size: 0.9em; transition: background-color 0.2s;" onmouseover="this.style.backgroundColor='#2a2a2a'" onmouseout="this.style.backgroundColor='transparent'">
                        <div style="color: #4CAF50; font-weight: bold;">${dept.name}</div>
                        <div style="text-align: center; color: #2196F3; font-weight: bold;">${dept.userCount}명</div>
                        <div style="text-align: center; color: #FF9800; font-weight: bold;">${dept.totalRequests.toLocaleString()}</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function renderDepartmentActivityChart() {
            const ctx = document.getElementById('departmentActivityChart');
            
            if (!departmentData || !departmentData.departments || Object.keys(departmentData.departments).length === 0) {
                // 차트 영역에 메시지 표시
                ctx.parentElement.innerHTML = '<div class="loading">부서 활동 데이터가 없습니다.</div>';
                return;
            }
            
            // 기존 차트 삭제
            if (departmentActivityChart) {
                departmentActivityChart.destroy();
            }
            
            // 부서별 인원수 기준으로 Top 10 정렬
            const departments = Object.keys(departmentData.departments)
                .map(dept => ({
                    name: departmentData.departments[dept].name || dept,
                    userCount: departmentData.departments[dept].user_count || 0
                }))
                .sort((a, b) => b.userCount - a.userCount)
                .slice(0, 10); // Top 10만 선택
            
            if (departments.length === 0) {
                ctx.parentElement.innerHTML = '<div class="loading">표시할 부서 데이터가 없습니다.</div>';
                return;
            }
            
            const labels = departments.map(dept => dept.name);
            const userCounts = departments.map(dept => dept.userCount);
            
            departmentActivityChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '인원 수',
                        data: userCounts,
                        backgroundColor: 'rgba(76, 175, 80, 0.8)',
                        borderColor: '#4CAF50',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y', // 가로 막대 차트
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff',
                                font: {
                                    size: 11
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(26, 26, 46, 0.9)',
                            titleColor: '#4CAF50',
                            bodyColor: '#ffffff',
                            borderColor: '#4CAF50',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#aaaaaa',
                                font: {
                                    size: 10
                                }
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            title: {
                                display: true,
                                text: '인원 수',
                                color: '#4CAF50',
                                font: {
                                    size: 11
                                }
                            }
                        },
                        y: {

                        <div class="detail-card">
                            <div class="detail-title">사용자 ID</div>

                        </div>
                        <div class="detail-card">
                            <div class="detail-title">총 요청 수</div>
                            <div class="detail-value">${userData.total_requests}</div>
                        </div>
                        <div class="detail-card">

        function closeModal() {

        async function exportStats() {
            try {
                // 사용자 데이터를 다시 가져와서 최신 정보로 CSV 생성
                const usersResponse = await fetch('/api/stats/users');
                const usersData = await usersResponse.json();
                
                // CSV 헤더 (BOM 추가로 한글 깨짐 방지)
                const csvHeader = '\uFEFFID,이름,직급,부서,접속시간,요청수,접속일수,최근접속\n';
                
                // CSV 데이터 생성
                let csvContent = csvHeader;
                
                usersData.users.forEach(user => {
                    const userId = user.user_id.includes('@') ? user.user_id.split('@')[0] : user.user_id;
                    const displayName = user.display_name || user.profile?.Username || "Anonymous";
                    const position = user.profile?.Position || user.profile?.JobTitle || '-';
                    const department = user.profile?.DeptName || user.profile?.Department || '-';
                    const accessTime = user.profile?.LoginTime || user.profile?.LastLoginTime || '-';
                    const totalRequests = user.total_requests || 0;
                    const uniqueDays = user.unique_days || 0;
                    const lastAccess = user.last_access_time ? formatDateTime(user.last_access_time) : '-';
                    
                    // CSV 행 생성 (쉼표와 줄바꿈 이스케이프 처리)
                    const row = [
                        `"${userId.replace(/"/g, '""')}"`,
                        `"${displayName.replace(/"/g, '""')}"`,
                        `"${position.replace(/"/g, '""')}"`,
                        `"${department.replace(/"/g, '""')}"`,
                        `"${accessTime.replace(/"/g, '""')}"`,
                        totalRequests,
                        uniqueDays,
                        `"${lastAccess.replace(/"/g, '""')}"`
                    ].join(',') + '\n';
                    
                    csvContent += row;
                });
                
                // CSV 파일 다운로드
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `detail_access_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                
                console.log('CSV 파일이 성공적으로 내보내졌습니다.');
                
            } catch (error) {
                console.error('CSV 내보내기 실패:', error);
                alert('CSV 내보내기에 실패했습니다.');
            }
        }
        
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            
            if (dateStr === today.toISOString().split('T')[0]) {
                return '오늘';
            } else if (dateStr === yesterday.toISOString().split('T')[0]) {
                return '어제';
            } else {
                return date.toLocaleDateString('ko-KR', { 
                    month: 'short', 
                    day: 'numeric',
                    weekday: 'short'
                });
            }
        }

        function formatDateTime(dt) {
            if (!dt) return '-';
            const d = new Date(dt);
            if (isNaN(d.getTime())) return dt; // 이미 포맷된 문자열
            return d.toLocaleString('ko-KR', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function formatChartDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('ko-KR', { 
                month: 'short', 
                day: 'numeric'
            });
        }
        
        function showError(message) {
            document.getElementById('dailyStats').innerHTML = `<div class="error">${message}</div>`;
            document.getElementById('userTable').innerHTML = `<div class="error">${message}</div>`;
        }
        
        // 모달 외부 클릭 시 닫기
        window.onclick = function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                closeModal();
            }
        }
        
        // 페이지 로드 시 통계 로드
        loadStats();
        
        // 1분마다 자동 새로고침
        setInterval(loadStats, 60000);
    </script>
